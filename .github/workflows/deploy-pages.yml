name: Deploy MEKAN prototype and production

on:
  push:
    branches: [main, prototype]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Check out prototype source
        uses: actions/checkout@v4
        with:
          ref: prototype
          path: prototype-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            prototype-source/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install production dependencies
        working-directory: production-source
        run: npm ci

      - name: Test production source
        working-directory: production-source
        run: npm test

      - name: Install prototype dependencies
        working-directory: prototype-source
        run: npm ci

      - name: Test prototype source
        working-directory: prototype-source
        run: npm test

      - name: Verify production Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Set the VITE_SUPABASE_URL repository variable."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Set the VITE_SUPABASE_ANON_KEY repository variable."; exit 1; }
          node --input-type=module -e 'const url = new URL(process.env.VITE_SUPABASE_URL); if (url.protocol !== "https:" || !url.hostname.endsWith(".supabase.co")) { console.error("VITE_SUPABASE_URL must be an HTTPS Supabase project URL."); process.exit(1); }'

      - name: Verify prototype Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_PROTOTYPE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_PROTOTYPE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Set the VITE_PROTOTYPE_SUPABASE_URL repository variable to a separate test project."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Set the VITE_PROTOTYPE_SUPABASE_ANON_KEY repository variable to the test project's publishable key."; exit 1; }
          node --input-type=module -e 'const url = new URL(process.env.VITE_SUPABASE_URL); if (url.protocol !== "https:" || !url.hostname.endsWith(".supabase.co")) { console.error("VITE_PROTOTYPE_SUPABASE_URL must be an HTTPS Supabase project URL."); process.exit(1); }'

      - name: Build production site
        working-directory: production-source
        run: npm run build -- --mode pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build prototype site
        working-directory: prototype-source
        run: npm run build -- --mode pages-prototype
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_PROTOTYPE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_PROTOTYPE_SUPABASE_ANON_KEY }}

      - name: Assemble production and prototype sites
        run: |
          mkdir -p site site/prototype
          cp -a production-source/dist/. site/
          cp -a prototype-source/dist/. site/prototype/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production and prototype sites
        id: deployment
        uses: actions/deploy-pages@v4
